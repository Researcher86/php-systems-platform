name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    # The integration tests start the real stack - database server, cache
    # server, worker pool Master, HTTP server - as child processes. A run
    # that hangs on one of them must fail rather than sit on the runner.
    # The budget includes building the Docker image.
    timeout-minutes: 25
    env:
      # The five Systems Lab components are VCS dependencies fetched from
      # GitHub. Anonymous API requests share the runner's rate limit, so the
      # workflow's own token is handed to Composer - no secret to configure,
      # it is issued per run. docker-compose.yml passes it into the container.
      COMPOSER_AUTH: '{"github-oauth":{"github.com":"${{ secrets.GITHUB_TOKEN }}"}}'
    steps:
      - uses: actions/checkout@v4

      # The same Docker image and the same make targets as local development:
      # CI checks the environment the project is actually developed in.
      - run: make build

      - run: make install

      - run: make test

      - run: make analyse

      - run: make format-check

      - if: always()
        run: make down
